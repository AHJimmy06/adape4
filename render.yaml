services:
  - type: web
    name: adape4-reservas-vuelos-api
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT backend.wsgi:app
    healthCheckPath: /api/vuelos
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_MINUTES
        value: "60"

      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: PUBLIC_API_URL
        value: https://adape4-reservas-vuelos-api.onrender.com
      - key: MAILTRAP_ENABLED
        value: "true"
      - key: MAILTRAP_API_TOKEN
        sync: false
      - key: MAILTRAP_INBOX_ID
        sync: false
      - key: MAILTRAP_FROM_EMAIL
        value: reservas@aerotech.example
